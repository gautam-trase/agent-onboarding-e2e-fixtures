name: Fixture checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  frameworks:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        framework: [langchain, adk]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r github_onboarding/${{ matrix.framework }}/requirements.txt pytest
      - run: python -m pytest tests/
        env:
          FIXTURE_FRAMEWORK: ${{ matrix.framework }}
